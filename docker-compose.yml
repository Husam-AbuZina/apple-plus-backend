services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - ../mongodb-data:/data/db

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/apple-plus
    volumes:
      - product-uploads:/app/uploads
    depends_on:
      - mongo

volumes:
  product-uploads: